[package]
name = "thalix-rust"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "1.3"
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security"
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.3"
